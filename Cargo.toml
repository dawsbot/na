[package]
name = "na"
version = "0.2.0"
edition = "2021"
description = "npm audit, byte-for-byte, without Node.js"
license = "MIT"
repository = "https://github.com/dawsbot/na"
rust-version = "1.80"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "gzip", "http2"], default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "process", "fs"] }
futures = "0.3"
clap = { version = "4", features = ["derive"] }
anyhow = "1.0"
indexmap = { version = "2", features = ["serde"] }
regex = "1"
flate2 = "1"
bytes = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
